name: Daily literature update

on:
  workflow_dispatch:
  schedule:
    # 06:00 KST every day (21:00 UTC previous day)
    - cron: '0 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_papers.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers README.md
          if git diff --cached --quiet; then
            echo "No literature changes"
          else
            git commit -m "chore: daily literature update"
            git push
          fi
